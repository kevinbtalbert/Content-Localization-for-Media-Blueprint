name: Content Localization for Media
entries:
  - title: Content Localization for Media on Cloudera AI
    label: content-localization-cai
    short_description: |
      End-to-end deployment of NVIDIA's Content Localization Blueprint on
      Cloudera AI Workbench with local NIM inference via Ray, S2S dubbing,
      and a Next.js demo UI.
    long_description: |
      Requires the custom runtime **ContentLocalization**
      (build the repository root Dockerfile and register it in Runtime Catalog).
      On Configure Project, select that edition — not stock **Nvidia GPU**.
      Leave **Enable Spark** off unless you add a compatible Spark addon.
    image_path: "https://github.com/kevinbtalbert/Content-Localization-for-Media-Blueprint/blob/main/assets/AMP_thumbnail.png?raw=true"
    tags:
      - Content Localization
      - NVIDIA NIM
      - Ray
      - GPU
      - Media
    git_url: "https://github.com/kevinbtalbert/Content-Localization-for-Media-Blueprint.git"
    is_prototype: true
    is_community: true
    is_new: true
