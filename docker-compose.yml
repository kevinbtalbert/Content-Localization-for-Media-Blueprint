#
# Single-container Content Localization stack.
# Requires: NVIDIA Container Toolkit, Docker socket, 2 GPUs (for ASD + LipSync NIMs).
#
# Usage:
#   docker compose --env-file configs/elevenlabs.env --env-file .env up --build
#
# Optional pre-built image:
#   docker build -t content-localization:1.8.0-turing .
#   IMAGE=content-localization:1.8.0-turing docker compose up

services:
  content-localization:
    container_name: content-localization
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE:-content-localization:latest}
    runtime: nvidia
    shm_size: 8gb
    stdin_open: true
    tty: true
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
      - "${CONTROLLER_GRPC_API_PORT:-50056}:${CONTROLLER_GRPC_API_PORT:-50056}"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NGC_API_KEY=${NGC_API_KEY:-${LIPSYNC_API_KEY:-${ASD_API_KEY:-}}}
      - LIPSYNC_API_KEY=${LIPSYNC_API_KEY:-${NGC_API_KEY:-}}
      - ASD_API_KEY=${ASD_API_KEY:-${NGC_API_KEY:-}}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - CAMB_API_KEY=${CAMB_API_KEY:-}
      - S2S_SERVICE=${S2S_SERVICE:-EL_DUBBING}
      - CONFIG_FILE=/opt/content-localization/configs/elevenlabs.env
      - APP_PORT=${APP_PORT:-3000}
      - START_NIMS=${START_NIMS:-1}
      - LIPSYNC_IMAGE=${LIPSYNC_IMAGE:-nvcr.io/nim/nvidia/lipsync:1.3.0}
      - ASD_IMAGE=${ASD_IMAGE:-nvcr.io/nim/nvidia/active-speaker-detection:1.1.0}
      - LIPSYNC_NIM_TAGS_SELECTOR=${LIPSYNC_NIM_TAGS_SELECTOR:-language=de}
      - CONTROLLER_VS_CODE_DEBUG=${CONTROLLER_VS_CODE_DEBUG:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LIPSYNC_MODEL_MOUNT_PATH:-./volumes/models/lipsync}:/var/lib/content-localization/models/lipsync
      - ${ASD_MODEL_MOUNT_PATH:-./volumes/models/asd}:/var/lib/content-localization/models/asd
      - ./volumes/demo-app:/var/lib/content-localization/demo-app
      - ./assets:/opt/content-localization/assets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

networks:
  default:
    name: content-localization-network
