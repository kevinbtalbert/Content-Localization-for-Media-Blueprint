name: Content Localization for Media
description: |
  Deploy NVIDIA's Content Localization Blueprint on Cloudera AI Workbench with
  bundled LipSync/ASD NIM GPU applications, ElevenLabs/CambAI speech-to-speech
  dubbing, and the Next.js demo UI — single ContentLocalization runtime.
author: Cloudera
specification_version: 1.0
prototype_version: 1.2
date: "2026-08-31"

environment_variables:
  NGC_API_KEY:
    description: "NGC API key for NVIDIA NIM model access (plain string at AMP install)"
  S2S_SERVICE:
    default: "EL_DUBBING"
    description: "Speech-to-Speech backend: EL_DUBBING (ElevenLabs) or CAMB_DUBBING (CambAI)"
  ELEVENLABS_API_KEY:
    description: "ElevenLabs API key (plain string; required when S2S_SERVICE=EL_DUBBING)"
  CAMB_API_KEY:
    description: "CambAI API key (plain string; required when S2S_SERVICE=CAMB_DUBBING)"
  LIPSYNC_NIM_TAGS_SELECTOR:
    default: "language=de"
    description: "NIM_TAGS_SELECTOR for LipSync language model"
  S2S_DEFAULT_TARGET_LANGUAGE:
    default: "de"
    description: "Default target dubbing language"

runtimes:
  # Single registered runtime — NIM servers are bundled in this image at build time.
  - editor: JupyterLab
    kernel: Python 3.13
    edition: ContentLocalization
    version: "1.2"

tasks:
  - type: run_session
    name: Validate CAI Prerequisites
    script: cai/amp/0_spike/validate_cai_prerequisites.py
    short_summary: Run Phase-0 checks (GPU, NGC key, bundled NIMs)
    kernel: python3
    cpu: 2
    memory: 4
    gpu: 1

  - type: run_session
    name: Install Python Dependencies
    script: cai/amp/1_install/install_dependencies.py
    short_summary: Install blueprint Python deps and generate protobuf code
    kernel: python3
    cpu: 4
    memory: 8

  - type: run_session
    name: Record NIM Bundle Configuration
    script: cai/amp/1_install/record_nim_images.py
    short_summary: Validate NGC key and record bundled NIM metadata
    kernel: python3
    cpu: 2
    memory: 4

  - type: start_application
    name: LipSync NIM
    subdomain: cl-lipsync
    entity_label: lipsync-nim
    script: cai/amp/4_services/start_lipsync_nim.py
    short_summary: Start bundled LipSync NIM (ContentLocalization runtime, 1 GPU)
    kernel: python3
    cpu: 4
    memory: 32
    gpu: 1
    shared_memory_limit: 4
    environment_variables:
      TASK_TYPE: START_APPLICATION

  - type: start_application
    name: ASD NIM
    subdomain: cl-asd
    entity_label: asd-nim
    script: cai/amp/4_services/start_asd_nim.py
    short_summary: Start bundled ASD NIM (ContentLocalization runtime, 1 GPU)
    kernel: python3
    cpu: 4
    memory: 32
    gpu: 1
    shared_memory_limit: 4
    environment_variables:
      TASK_TYPE: START_APPLICATION

  - type: start_application
    name: Speech-to-Speech Service
    subdomain: cl-s2s
    script: cai/amp/4_services/start_s2s.py
    short_summary: Start S2S gRPC service (ElevenLabs or CambAI)
    cpu: 2
    memory: 4
    environment_variables:
      TASK_TYPE: START_APPLICATION

  - type: run_session
    name: Wire Service Endpoints
    script: cai/amp/5_wire_endpoints/wire_endpoints.py
    short_summary: Write runtime_endpoints.env from NIM and S2S metadata
    kernel: python3
    cpu: 2
    memory: 2

  - type: start_application
    name: Controller Service
    subdomain: cl-controller
    script: cai/amp/4_services/start_controller.py
    short_summary: Start Controller gRPC orchestration service
    cpu: 4
    memory: 8
    environment_variables:
      TASK_TYPE: START_APPLICATION

  - type: run_session
    name: Build Demo UI
    script: cai/amp/6_demo_ui/build_demo.py
    short_summary: npm install and build Next.js demo application
    kernel: python3
    cpu: 4
    memory: 8

  - type: start_application
    name: Content Localization Demo UI
    subdomain: content-localization-ui
    script: cai/amp/6_demo_ui/start_demo.py
    short_summary: Start Next.js demo UI
    long_summary: |
      Start the Content Localization web UI. Enable unauthenticated app access
      for external access to the demo subdomain.
    cpu: 2
    memory: 8
    environment_variables:
      TASK_TYPE: START_APPLICATION
