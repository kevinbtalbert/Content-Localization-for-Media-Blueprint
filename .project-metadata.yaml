name: Content Localization for Media
description: |
  Deploy Content Localization on Cloudera AI Workbench. AMP installs dependencies
  and starts the Launchpad web UI. Configure API keys, languages, and deployment
  mode in the app — settings persist across restarts.
author: Cloudera
specification_version: 1.0
prototype_version: 1.4
date: "2026-08-31"

runtimes:
  - editor: JupyterLab
    kernel: Python 3.13
    edition: ContentLocalization
    version: "1.4"

tasks:
  - type: run_session
    name: Install Python Dependencies
    script: cai/amp/1_install/install_dependencies.py
    short_summary: Install blueprint Python deps and generate protobuf code
    kernel: python3
    cpu: 4
    memory: 8

  - type: run_session
    name: Build Web UI
    script: cai/amp/6_demo_ui/build_demo.py
    short_summary: Build Next.js UI (skipped when runtime image already includes dist/)
    kernel: python3
    cpu: 4
    memory: 8

  - type: start_application
    name: Content Localization Launchpad
    subdomain: content-localization-ui
    script: cai/amp/6_demo_ui/start_demo.py
    short_summary: Start Launchpad — configure and build the localization pipeline
    long_summary: |
      Start the Content Localization Launchpad. Configure API keys and deployment
      mode, then build the pipeline from the UI. Enable unauthenticated app access
      for external URLs.
    cpu: 2
    memory: 8
    environment:
      TASK_TYPE: START_APPLICATION
