name: Content Localization for Media
description: |
  Deploy NVIDIA's Content Localization Blueprint on Cloudera AI Workbench with
  local NIM inference (ASD + LipSync) on a Ray GPU cluster, ElevenLabs/CambAI
  speech-to-speech dubbing, and the Next.js demo UI.
author: Cloudera
specification_version: 1.0
prototype_version: 1.0
date: "2026-08-27"

environment_variables:
  NGC_API_KEY:
    default: ""
    description: "NGC API key for pulling NVIDIA NIM container images from nvcr"
  S2S_SERVICE:
    default: "EL_DUBBING"
    description: "Speech-to-Speech backend: EL_DUBBING (ElevenLabs) or CAMB_DUBBING (CambAI)"
  ELEVENLABS_API_KEY:
    description: "ElevenLabs API key (required when S2S_SERVICE=EL_DUBBING)"
  CAMB_API_KEY:
    description: "CambAI API key (required when S2S_SERVICE=CAMB_DUBBING)"
  LIPSYNC_NIM_TAGS_SELECTOR:
    default: "language=de"
    description: "NIM_TAGS_SELECTOR for LipSync language model"
  S2S_DEFAULT_TARGET_LANGUAGE:
    default: "de"
    description: "Default target dubbing language"
  RAY_HEAD_APP_NAME:
    default: "content-localization-ray-head"
    description: "Ray cluster head application subdomain name"
  RAY_NIM_GPU_WORKER_COUNT:
    default: "2"
    description: |
      Number of Ray GPU worker pods. Default 2 hosts LipSync and ASD (one GPU each).

runtimes:
  - editor: JupyterLab
    kernel: Python 3.13
    edition: Nvidia GPU

tasks:
  - type: run_session
    name: Validate CAI Prerequisites
    script: cai/amp/0_spike/validate_cai_prerequisites.py
    short_summary: Run Phase-0 prerequisite checks (Docker, GPU, NGC key)
    kernel: python3
    cpu: 2
    memory: 4
    gpu: 1

  - type: run_session
    name: Install Python Dependencies
    script: cai/amp/1_install/install_dependencies.py
    short_summary: Install blueprint Python deps and generate protobuf code
    kernel: python3
    cpu: 4
    memory: 8

  - type: run_session
    name: Pull NIM Container Images
    script: cai/amp/1_install/pull_nim_images.py
    short_summary: NGC login and docker pull for ASD and LipSync NIM images
    kernel: python3
    cpu: 2
    memory: 8
    gpu: 1

  - type: run_session
    name: Setup Ray Environments
    script: cai/amp/2_ray_cluster/setup_ray_env.py
    short_summary: Create Ray base and NIM engine virtual environments
    kernel: python3
    cpu: 4
    memory: 16

  - type: create_job
    name: Launch Ray Cluster
    entity_label: launch-ray-cluster
    script: cai/ray/cai_integration/launch_ray_cluster_job.py
    short_summary: Create job to launch Ray head and GPU workers
    kernel: python3
    cpu: 2
    memory: 8
    environment:
      TASK_TYPE: CREATE/RUN_JOB

  - type: run_job
    entity_label: launch-ray-cluster
    short_summary: Run Ray cluster launch job

  - type: run_session
    name: Deploy NIM Models
    script: cai/amp/3_deploy_nims/deploy_nims.py
    short_summary: Deploy ASD and LipSync NIMs via Ray Management API
    kernel: python3
    cpu: 2
    memory: 4

  - type: start_application
    name: Speech-to-Speech Service
    subdomain: cl-s2s
    script: cai/amp/4_services/start_s2s.py
    short_summary: Start S2S gRPC service (ElevenLabs or CambAI)
    cpu: 2
    memory: 4
    environment_variables:
      TASK_TYPE: START_APPLICATION

  - type: run_session
    name: Wire Service Endpoints
    script: cai/amp/5_wire_endpoints/wire_endpoints.py
    short_summary: Write runtime_endpoints.env from NIM and S2S metadata
    kernel: python3
    cpu: 2
    memory: 2

  - type: start_application
    name: Controller Service
    subdomain: cl-controller
    script: cai/amp/4_services/start_controller.py
    short_summary: Start Controller gRPC orchestration service
    cpu: 4
    memory: 8
    environment_variables:
      TASK_TYPE: START_APPLICATION

  - type: run_session
    name: Build Demo UI
    script: cai/amp/6_demo_ui/build_demo.py
    short_summary: npm install and build Next.js demo application
    kernel: python3
    cpu: 4
    memory: 8

  - type: start_application
    name: Content Localization Demo UI
    subdomain: content-localization-ui
    script: cai/amp/6_demo_ui/start_demo.py
    short_summary: Start Next.js demo UI
    long_summary: |
      Start the Content Localization web UI. Enable unauthenticated app access
      for external access to the demo subdomain.
    cpu: 2
    memory: 8
    environment_variables:
      TASK_TYPE: START_APPLICATION
