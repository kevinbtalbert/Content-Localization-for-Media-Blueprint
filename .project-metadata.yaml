name: Content Localization for Media
description: |
  Deploy the Content Localization demo on Cloudera AI Workbench. AMP installs
  dependencies and starts the web UI. Open the in-app Setup page to enter API
  keys, languages, and deployment mode — settings persist across restarts.
author: Cloudera
specification_version: 1.0
prototype_version: 1.2
date: "2026-08-31"

runtimes:
  - editor: JupyterLab
    kernel: Python 3.13
    edition: ContentLocalization
    version: "1.2"

tasks:
  - type: run_session
    name: Install Python Dependencies
    script: cai/amp/1_install/install_dependencies.py
    short_summary: Install blueprint Python deps and generate protobuf code
    kernel: python3
    cpu: 4
    memory: 8

  - type: run_session
    name: Build Demo UI
    script: cai/amp/6_demo_ui/build_demo.py
    short_summary: Build Next.js demo (skipped when runtime image already includes dist/)
    kernel: python3
    cpu: 4
    memory: 8

  - type: start_application
    name: Content Localization Demo UI
    subdomain: content-localization-ui
    script: cai/amp/6_demo_ui/start_demo.py
    short_summary: Start web UI with Setup & Deployment page
    long_summary: |
      Start the Content Localization web UI. Open Setup to deploy serverless or
      bundled NIM services. Enable unauthenticated app access for external URLs.
    cpu: 2
    memory: 8
    environment:
      TASK_TYPE: START_APPLICATION
