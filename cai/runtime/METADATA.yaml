# Runtime Catalog registration reference for Content Localization AMP
#
# Register the image in Admin → Runtime Catalog (Add Runtime) OR host
# cai/runtime/repo-assembly.json and add it under Site Administration → Runtime.
#
# AMP auto-select uses .project-metadata.yaml runtimes — strings must match EXACTLY.

name: "Content Localization for Media"
slug: "content-localization"
launchable: true
lifecycle_status: Active

# Must match Dockerfile ML_RUNTIME_* and .project-metadata.yaml runtimes block.
amp_runtime_match:
  editor: JupyterLab
  kernel: Python 3.13
  edition: ContentLocalization
  version: "1.2"

docker_image_example: "docker.io/<your-user>/contentlocalization:1.2.0"

catalog_classification:
  - Developer Example
tags:
  - content-localization
  - nvidia-nim
  - gpu
product_mapping:
  - Cloudera AI Workbench
description: |
  Single Docker image for NVIDIA Content Localization on Cloudera AI Workbench.
  LipSync and ASD NIM servers are bundled at image build time (multi-stage FROM
  nvcr.io NIM images). Build requires NGC login; register one runtime edition only.
