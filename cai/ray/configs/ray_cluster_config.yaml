# Ray Cluster Configuration — Content Localization on CAI
#
# GPU SKU and worker count are overridden at AMP install time via project env vars:
#   RAY_GPU_ACCELERATOR_TYPE  (default A10G)
#   RAY_GPU_NODE_LABEL_VALUE  (optional; auto-derived when empty)
#   RAY_NIM_GPU_WORKER_COUNT  (default 2)

ray_cluster:
  head_cpu: 8
  head_memory: 24
  management_api_cpu: 4
  management_api_memory: 12

  worker_groups:
    - name: nim-gpu-workers
      node_type: nim-gpu-worker
      count: 2
      cpu: 8
      memory: 64
      gpus: 1
      accelerator_type: A10G
      node_label:
        nvidia.com/gpu.product: "NVIDIA-A10G"

  ray_port: 6379
  dashboard_port: 8265

cai:
  head_runtime_identifier: "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-pbj-jupyterlab-python3.13-standard:2026.08.1-b5"
  worker_runtime_identifier: "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-pbj-jupyterlab-python3.13-cuda:2026.08.1-b5"
  project_name: "content-localization"
  head_app_name: "content-localization-ray-head"

ray_serve: {}

monitoring:
  prometheus_host: null
  grafana_host: null
  grafana_iframe_host: null
  grafana_org_id: "1"

environment: {}
